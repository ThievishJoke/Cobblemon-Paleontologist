plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.121'
    id 'org.jetbrains.kotlin.jvm' version '2.2.0'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name = "Cobblemon"
        url = "https://maven.impactdev.net/repository/development/"
    }
    maven{
        name = "Kotlin"
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }
    maven{
        url = "https://api.modrinth.com/maven"
    }
    maven{
        url = "https://maven.neoforged.net/releases"
    }
    mavenLocal()
}

base {
    archivesName = archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {

    implementation("com.cobblemon:neoforge:${project.cobblemon_version}")
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:${project.forge_kotlin_version}")

    runtimeOnly("thedarkcolour:kotlinforforge-neoforge:5.10.0")

}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = project.maven_group
            artifactId = project.archives_base_name
            version = project.version

            from components.java
        }
    }

    repositories {
        maven {
            name = "CobbledCreators"
            url = uri("https://maven.cobbled-creators.org/releases/")

            credentials {
                username = project.findProperty("cobbledMavenUsername")
                password = project.findProperty("cobbledMavenPassword")
            }
        }
    }
}