plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
    //id 'org.jetbrains.kotlin.jvm' version '2.2.20'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    mavenCentral()
    maven {
        name = "Impact"
        url = "https://maven.impactdev.net/repository/development/"
    }
    //maven{
    //    name = "Cobbled"
    //    url = "https://maven.cobbled-creators.org/releases/"
    //}
    //maven {
    //    name = "Terraformers"
    //    url = "https://maven.terraformersmc.com"
    //}
    //maven {
    //    name = "ModMaven"
    //    url = "https://modmaven.dev"
    //}
    //maven {
    //    name = "Modrinth"
    //    url = "https://api.modrinth.com/maven"
    //}
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    //modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"

    // Kotlin
    //modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

    // Cobblemon
    modImplementation "com.cobblemon:fabric:${project.cobblemon_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "cobblemon_version", project.cobblemon_version
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "cobblemon_version": project.cobblemon_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
